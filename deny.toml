# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"
# Documented, per-advisory decisions (NOT a blanket suppression). Vulnerabilities are NOT ignored:
# the one real vuln in the tree (RUSTSEC-2023-0071, rsa "Marvin" timing attack) was removed at the
# source by dropping the unused `ssh`/`pqcrypto` features on bc-envelope/bc-components (see
# Cargo.toml), which also dropped the 4 archived pqcrypto-* unmaintained advisories.
#
# The two below are unmaintained-status advisories only (no CVE), both compile-time proc-macros with
# no runtime attack surface, and both unavoidable: their sources are already at the latest published
# version and pull them as unconditional (non-optional) dependencies, so they cannot be bumped or
# feature-gated away without forking/dropping bc-envelope or matrix-sdk. A real CVE would carry a new
# advisory ID and still fail this gate. Re-evaluate when bc-envelope / matrix-sdk publish updates.
ignore = [
  "RUSTSEC-2024-0436", # paste: unmaintained; unconditional build-dep of bc-envelope 0.43 (latest)
  "RUSTSEC-2026-0173", # proc-macro-error2: unmaintained; via matrix-sdk 0.18 (latest) -> aquamarine
  # bitmaps: unmaintained-status advisory only (no CVE). Unconditional dep of imbl 6.1 (latest),
  # itself an unconditional dep of matrix-sdk-common 0.18 (latest) — the same matrix-sdk lineage
  # as proc-macro-error2 above; cannot be bumped or feature-gated away without forking matrix-sdk.
  # Re-evaluate when matrix-sdk/imbl publish updates.
  "RUSTSEC-2026-0247", # bitmaps: unmaintained; via matrix-sdk-common 0.18 -> imbl 6.1
  # ttf-parser: unmaintained-status advisory only (no CVE). Unconditional dep of lopdf 0.42
  # (latest) via pdf-extract 0.12 (latest) — the `fs` tool's PDF text extraction. Unlike the two
  # above it does parse input at runtime, but the exposure is bounded: input is workspace-contained
  # document bytes, capped at 50 MB, parsed on an isolated blocking task whose panic is contained
  # and reported as an extraction failure (never a crash), and PDF extraction is behind the
  # `extract` cargo feature. Re-evaluate when pdf-extract/lopdf move off ttf-parser (upstream
  # suggests `skrifa`).
  "RUSTSEC-2026-0192",

  # [waveB:msg-adapters] Discord (daemon-discord) — serenity_self 0.13.3 transitive advisories.
  # serenity_self is the self-bot fork pinned to an OLD reqwest 0.11 / rustls 0.21+0.22 /
  # tokio-tungstenite 0.21 TLS+HTTP stack; it is the sole path to every ID below (verified: each
  # dep tree terminates at `serenity_self 0.13.3 -> daemon-discord -> daemon`). None can be bumped
  # or feature-gated away without forking serenity_self, and no safe upgrade of the leaf crate is
  # reachable while serenity_self pins these majors. The user has PRE-ACCEPTED this maturity / ToS /
  # advisory risk in the approved plan (self-bot user-token mode carries Discord ToS/ban risk on top
  # of these). Tracked for an upstream serenity_self TLS-stack bump; re-evaluate (or feature-gate /
  # drop Discord) then. NOTE: the rustls-webpki name-constraint / CRL issues are reachable only
  # after signature verification and require issuer misissuance, and Discord speaks only to Discord's
  # own pinned endpoints — bounded exposure. See the prominent Discord flag in the integration report.
  # [swarm] bincode: unmaintained-status advisory only (no CVE) — the bincode team ceased
  # development and consider 1.3.3 "complete"; the advisory flags the crate itself, so no version
  # pin or alternative resolves it. It is an UNCONDITIONAL (non-optional) dependency of burn-core
  # 0.21 (burn's record (de)serialization), the only path to it (verified: bincode 2.0.1 ->
  # burn-core -> burn -> daemon-vhc-host). burn is isolated to the `daemon-vhc-host` WORKER fault domain
  # (§10.1) — never linked into the node process — and in the shipped product it builds only as an
  # out-of-gate per-backend Nix lane (like the daemon-infer engines), so this is not in the node's
  # runtime attack surface. Exposure is further bounded: bincode only deserializes burn's own
  # checkpoint/model records inside the sandboxed worker. A real CVE would carry a new advisory ID
  # and still fail this gate. Re-evaluate when burn moves off bincode (postcard/rkyv are upstream
  # candidates) or drops it behind a feature.
  "RUSTSEC-2025-0141", # bincode: unmaintained; unconditional dep of burn-core 0.21 (daemon-vhc-host)
  "RUSTSEC-2025-0057", # fxhash: unmaintained; direct dep of serenity_self 0.13.3
  "RUSTSEC-2025-0134", # rustls-pemfile 1.0.4: unmaintained; via reqwest 0.11 -> serenity_self
  "RUSTSEC-2026-0049", # rustls-webpki 0.102.8: CRL distribution-point matching; via serenity_self
  "RUSTSEC-2026-0098", # rustls-webpki 0.101.7/0.102.8: URI name constraints; via serenity_self
  "RUSTSEC-2026-0099", # rustls-webpki 0.101.7/0.102.8: wildcard-name constraints; via serenity_self
  "RUSTSEC-2026-0104", # rustls-webpki 0.101.7/0.102.8: reachable CRL-parse panic; via serenity_self
  # h2 0.3.27 (hyper 0.14 line): unbounded empty DATA frames, LOW severity; the fix (0.4.16) exists
  # only on the 0.4 line, which this workspace already carries (patched). The 0.3 entry is pinned
  # solely by serenity_self's reqwest 0.11 / hyper 0.14 stack (same tree as the IDs above) and has
  # no patched 0.3.x release. Same bounded exposure + tracked serenity_self bump as the block above.
  "RUSTSEC-2026-0258", # h2 0.3.27: unbounded empty DATA frames; via serenity_self (0.4 line patched)
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates are path deps (no version), which cargo-deny otherwise flags as
# wildcards. Allow that specifically while still denying real `version = "*"` on registry crates.
allow-wildcard-paths = true

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "ISC",
  "Unicode-3.0",
  # Added after the dependency audit - all permissive or file-level weak-copyleft (MPL), safe to
  # link against. Each appears only in transitive dependencies.
  "MPL-2.0",
  "BSD-2-Clause-Patent",
  "Zlib",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "BlueOak-1.0.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
