[package]
name = "daemon-vhc-sdk-profiles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The comm/optimizer profiles as composable strategies over Burn tensors + det math
# (architecture §6 "Profiles" row; refactor §7 "profiles re-express over Burn tensors + det math
# in `sdk/daemon-vhc-sdk-profiles`" — the Phase-C models-exodus companion of `guests/tiny-llama`).
#
# The det-lane math delegates every kernel to the normative dual-compiled `daemon-vhc-det`
# (architecture §3.2: any module runs it in-guest with zero host support), so a guest linking this
# crate reproduces the profiles' consensus math BIT-EXACTLY — pinned by this crate's golden suite
# (pinned trajectory inputs → pinned post-ingest outputs, both standing literals; the equivalence
# proof against the retired reference implementation was carried into them at capture). The Burn
# doorway (`burn_lane`) is the model↔profile composition surface for `HostBackend`/native authors.
#
# Dependency rules (architecture §7, CI-enforced): sdk/* links contracts/* and lower sdk layers
# only — never host/*. Normal deps: `daemon-vhc-det` + serde/ciborium (the payload wire) + the
# pinned `burn` core (tensor doorway; no backend).

[dependencies]
daemon-vhc-det = { workspace = true }
# The streamed det-lane fold walks (`streaming`) consume the consensus SDK's pinned
# slice-decomposition schedule (`fold_walk`) and streaming digest carry (`digest::DigestCarry`).
# A lower→same-layer sdk edge (sdk-consensus links contracts only), wasm32-clean; the guest graph
# already links both crates, and profiles is dev/harness-only on the host side, so the host-graph
# negative architecture test is unaffected.
daemon-vhc-sdk-consensus = { workspace = true }
serde = { workspace = true, features = ["derive"] }
ciborium = { workspace = true }
# The pinned Burn the compute@2 wire is defined against (decisions D8): tensor core only, no
# backend — `burn_lane` is generic over `B: Backend` (guests bind `HostBackend`, tests NdArray).
burn = { version = "=0.21.0", default-features = false, features = ["std"] }

[dev-dependencies]
# The windowed ≡ resident parity + schedule-conformance suites: `Seed` for the digest carry and
# the shared fold-walk/digest-carry vector fixtures (JSON).
daemon-vhc-proto = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
