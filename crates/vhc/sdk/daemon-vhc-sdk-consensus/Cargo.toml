[package]
name = "daemon-vhc-sdk-consensus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The consensus SDK layer (architecture §7 `sdk/daemon-vhc-sdk-consensus`; refactor §8/D0):
# deterministic batch-window **assignment math** moved out of `daemon-vhc-proto` at D0 — the proto
# is algorithm-free wire mechanism from D0 on (dep-check-enforced). D1 adds `Authority` +
# `Committed<T>` here; D2 adds the coordinator drivers. Linked by worker drivers
# (daemon-vhc-sdk-rounds), coordinator drivers, the simulator, and — transitionally, as tracked
# dep-check exceptions retiring at D2 — the native coordinator, the session's v1 RoundEngine, and
# the testkit's barrier harness.
#
# Dependency rules (architecture §7, CI-enforced): sdk/* links contracts/* and lower sdk layers
# ONLY — never host/*. This crate links exactly `daemon-vhc-proto` (wire types: PeerId/Seed/
# GlobalBatch/BatchWindow/ThroughputClass + blake3 hashing), staying wasm32-clean.
[lib]
path = "src/lib.rs"

[dependencies]
daemon-vhc-proto = { workspace = true }
# serde (derive) for the canonical-CBOR-serializable coordinator state — the replay-oracle and
# dual-compilation foundation (relocated with the coordinator driver at D2). wasm32-clean.
serde = { workspace = true }
# The envelope's opaque `authority` section is a `ciborium::value::Value` (D0); D1's typed
# `AuthorityConfig` decodes from it. ciborium is the same wasm32-clean codec `daemon-vhc-proto`
# already links, so this keeps the crate guest-buildable.
ciborium = { workspace = true }
# The round state-digest schedule (xxh3-128, spec §5.6) — moved here with the round vocabulary
# (the proto is round-vocabulary-free mechanism). wasm32-clean.
xxhash-rust = { workspace = true }

[dev-dependencies]
# Integer-only property testing of `tick` determinism (relocated with the coordinator driver at
# D2; TDD PROTO-16). Dev-only: does not affect the crate's wasm-clean normal-dependency surface.
proptest = { workspace = true }
# The shared digest-carry / fold-walk vectors (`tests/fixtures/*.json`) are JSON so every
# conforming streaming-fold implementation executes one fixture (the seat/roster pattern).
serde_json = { workspace = true }
# CDDL conformance gate for the round message schemas (`daemon-vhc.cddl`, moved here with the
# schemas): in-process validator, same exact pin as the daemon-api conformance flow.
cddl-cat = "=0.7.1"

[lints]
workspace = true
