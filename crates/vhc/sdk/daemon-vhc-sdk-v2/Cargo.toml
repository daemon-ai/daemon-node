[package]
name = "daemon-vhc-sdk-v2"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = """
The major-2 guest SDK tier: raw vhc@2/net@2/sys@2 bindings, the module layer + SDK-derived
claim/manifest, migration scaffolding (ABI §10), and the main! export macro. A PERMANENT SIBLING
of daemon-vhc-sdk, deliberately NOT a module inside it: the v1 SDK's source feeds the frozen v1
guest pins (guests.blake3 / the A0 fixture), and any edit to it — even an unused cfg-gated
module — perturbs its codegen and the pinned tiny_llama.wasm bytes (measured, sittings 8-9).
The crates merge only when the v1 SDK is next deliberately re-pinned (Phase E at the earliest).
"""

[dependencies]
ciborium = { workspace = true }
daemon-vhc-proto = { path = "../../contracts/daemon-vhc-proto" }
serde = { workspace = true, features = ["derive"] }
# The corpus manifest is JSON (`manifest.json`, the same schema the v1 host pipeline reads) —
# the corpus-windowing policy layer parses it in-module. Existing workspace pin.
serde_json = { workspace = true }
# Shard content addressing (fetch-time integrity re-check at the policy layer). Existing pin.
blake3 = { workspace = true }

[lints]
workspace = true
