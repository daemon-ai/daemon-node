[package]
name = "daemon-vhc-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The worker binary — split out of `daemon-vhc-host`'s `[[bin]]` targets at Phase A2 per refactor
# §3/§11 ("splits into `bins/daemon-vhc-worker` when A0 gives it real work") and architecture §7's
# tree (`crates/vhc/bins/daemon-vhc-worker`). A strictly mechanical move: the child side of the
# frozen worker protocol (§10.2) over the length-framed stdio cut, driving the `daemon-vhc-host`
# wasm runtime. Runs ANY role's module once the event-loop driver lands; the node side stays a library
# (`daemon-vhc-node` + `daemon-vhc-supervisor`, embedded by the product's node binary — never here).
# `daemon-vhc-probe` and the `daemon-vhc` CLI remain `[[bin]]` targets of `daemon-vhc-host` (the
# probe is the MinGW-linkable fleet-validation artifact and links none of this worker's stdio/crash
# stack; nothing about this split forces them to move).
[[bin]]
name = "daemon-vhc-worker"
path = "src/main.rs"

[dependencies]
# The shared ABI contract (driver-selection vocabulary + refusal taxonomy) the assess path names.
daemon-vhc-abi = { workspace = true }
# The host worker runtime this binary drives: driver selection (`select_driver`), the device
# probe, `EngineConfig`, and the per-backend lanes (forwarded features below).
daemon-vhc-host = { workspace = true }
# The R↔E seam + the frozen node↔worker wire (`daemon_vhc_session::protocol`) this binary speaks.
daemon-vhc-session = { workspace = true }
# Envelope open/verify (`SignedEnvelope`) on the assess path.
daemon-vhc-proto = { workspace = true }
# The envelope artifact plane (`ArtifactResolver`, `file://` blake3-verified) the worker uses to
# fetch its experiment module from the frozen envelope's artifact map (§8).
daemon-vhc-net = { workspace = true }
# The length-framed `CutChannel` stdio transport (same supervision contract as the other
# coprocessor workers, §10.2).
daemon-provision = { workspace = true }
# Async runtime for the stdio command/event loop.
tokio = { workspace = true }
# Grants-document + coordinator-message CBOR on the v2 join path; payload hashing at the commit
# seam (plumbing-owned sealing, Phase A).
ciborium = { workspace = true }
blake3 = { workspace = true }
# Consent-gated crash reporting (panics + native minidumps — the worker links heavy native engine
# trees, so a segfault is a real failure mode). A runtime no-op unless the spawning node injected
# a DSN + `DAEMON_CRASH_CONSENT=1`.
daemon-telemetry = { workspace = true }
# The SSRF-safe outbound HTTP client the module store-fetch path rides. OPTIONAL — pulled in only
# by the `vhc-net` feature. (The `async-trait` optional dep that rode beside it for live.rs's
# concrete `PayloadStore` impl retired with live.rs at the Phase-E sunset.)
daemon-egress = { workspace = true, optional = true }
# The SDK schema layer (round messages) the HARNESS-ONLY in-process self-driven join decodes.
# OPTIONAL, enabled only by the `harness` feature: the production worker build carries no round
# vocabulary (the opaque-host boundary, dep-check-enforced — `vhc-dep-check` asserts the schema
# crates are absent from this binary's default normal graph).
daemon-vhc-sdk-consensus = { workspace = true, optional = true }

# Per-backend lane selection: this bin crate FORWARDS its lanes into `daemon-vhc-host`, whose lib
# code (`burn_backend.rs`/`runtime.rs`/`probe.rs`) is what the features actually gate — the
# `cfg(feature = …)` blocks in this binary's own `backend.rs`/`main.rs` select the matching
# `BackendKind` at spawn. Feature names are unchanged from the pre-split `daemon-vhc-host` bin
# lanes, so `--features vhc-net,wgpu` invocations only re-point `-p`.
[features]
default = ["cpu"]
# The CPU (det-lane fp32) lane — no extra backend deps.
cpu = ["daemon-vhc-host/cpu"]
# burn with the ndarray backend + autodiff — the G1 native lane.
burn-ndarray = ["daemon-vhc-host/burn-ndarray"]
# burn with the wgpu backend (Vulkan/RADV at runtime) — the G2 GPU lane. Opt-in only.
wgpu = ["daemon-vhc-host/wgpu"]
# burn with the CUDA backend (driver-API + NVRTC JIT at runtime) — the discrete-NVIDIA lane.
# Opt-in only.
cuda = ["daemon-vhc-host/cuda"]
# The networked module-fetch lane: `resolve_run`'s payload-store fetch of network module URLs
# (`r2://` / `https://` / `hf://`, presign via WS + egress). OFF the default gate so a default
# `cargo build`/`test`/`deny` never compiles the WS/TLS/iroh/QUIC tree. (Originally the A3 live
# coordinator attach — the RoundEngine-over-DualPlane consumer, live.rs, retired with the v1
# driver at the Phase-E sunset; the store fetch path is what remains. Whether the
# `daemon-vhc-net/iroh` edge is still warranted post-sunset is an open question — the surviving
# fetch path is WS/presign-only, but the cross-built fat-worker packaging lane (flake.nix's
# Windows worker) ships this feature set, so dropping the edge is a packaging decision.)
vhc-net = [
    "daemon-vhc-net/ws",
    "daemon-vhc-net/iroh",
    "dep:daemon-egress",
    # The role session's LIVE transport attach: provider construction from the node-authored
    # `SessionCredentials` (WS control plane, optional dual-plane iroh half, presigned-R2 /
    # filesystem content stores). Without this feature a join with live credentials refuses
    # typed (fail closed) and only the in-process smoke seat serves.
    "daemon-vhc-session/live-iroh",
]
# The in-process self-driven join (`src/session.rs`): drives the run's coordinator module
# in-process and decodes SDK round schemas — harness/test machinery, never a production build.
# Off the default gate so the shipped worker carries no round vocabulary.
harness = [
    "dep:daemon-vhc-sdk-consensus",
    "daemon-vhc-host/harness",
    "daemon-vhc-session/harness",
]

[dev-dependencies]
# The shared guest-workspace builder every wasm-backed test suite in this crate goes through
# (reproducibility remap env + cross-process build lock live there, once). Test-only.
daemon-vhc-guest-build = { workspace = true }
# tests/worker_protocol.rs (moved with the bin — `env!("CARGO_BIN_EXE_daemon-vhc-worker")` only
# resolves in the crate that owns the `[[bin]]` target): spawns the REAL worker binary through the
# node-side supervisor and directly over the provision cut, against a real tiny-llama `.wasm`.
daemon-vhc-supervisor = { workspace = true }
daemon-common = { workspace = true }
# tests/live_attach.rs: the promoted loopback relay-grade WS coordinator fixture two real worker
# processes attach through (the `harness` feature is fixture-only, never a production edge).
daemon-vhc-net = { workspace = true, features = ["harness"] }
# tests/live_attach.rs: scans a peer's durable journal segments to prove inbound certified
# frames DELIVERED (tag-12 evidence records) — the schema-free substrate crate.
daemon-vhc-journal = { workspace = true }
# tests/seat_smoke.rs: the node-side coordinator seat manager (claim/authorize/derive_bid) the
# test drives as the node for both seats. A test-only edge (the shipped worker never links the
# node service); no runtime dependency-direction change.
daemon-vhc-node = { workspace = true }
# Test-only: the genesis-authoring vocabulary for the in-process join suite — the coordinator
# role's opaque config is an authored `{state: CoordinatorState}` and the run's trust topology a
# typed `AuthorityConfig` (both consensus-SDK types). The RUNTIME native-tick edge this crate
# used to carry is GONE (the join drives the coordinator through daemon-vhc-host's
# production seat); this dev-dep only writes test fixtures. Tracked in vhc_dep_check [dev-dep].
daemon-vhc-sdk-consensus = { workspace = true }
# Test-only: the join/protocol suites author the genesis seed-form state contract (§6.1a) — the
# same dual-compiled distribution the guest expands — and fold it to the pinned expected_root.
daemon-vhc-det = { workspace = true }
blake3 = { workspace = true }
ciborium = { workspace = true }
# Test-only: the join suite authors its genesis from a throwaway identity keystore (the same
# store it hands the spawned worker by directory reference).
tempfile = "3"
# Test-only: the `AbiUnsupportedMajor` refusal input is a synthetic ABI-major-1 wasm image
# hand-assembled in `tests/worker_protocol.rs` (no vendored/recorded pre-refactor bytes) — the same
# `wasm-encoder` shape `daemon-vhc-host/tests/driver_selection.rs` uses. Already resolved in
# Cargo.lock (a wasmtime/cranelift transitive), so this dev-dep adds no new crate to the graph.
wasm-encoder = { workspace = true }

[lints]
workspace = true
