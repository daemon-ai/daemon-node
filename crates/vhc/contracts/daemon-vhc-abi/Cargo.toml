[package]
name = "daemon-vhc-abi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# Intentionally zero third-party dependencies: this crate is the ABI surface both sides of the
# wasm boundary must agree on (the major-2 constants, namespaces, and wire vocabularies). It is
# dual-compiled for native *and* wasm32 and links neither `sdk/*` nor `host/*` (the shared
# contracts ground). Keeping it dep-free lets both the guest SDK and the host runtime pin the same
# frozen surface without either side pulling the other.

[dev-dependencies]
# Grammar-validity gate ONLY (dev-only; never on the runtime/wasm32 surface, so the zero-dep rule
# above is preserved). The `journal_grammar` test asserts the normative §8.3 journal CDDL
# (`JOURNAL_CDDL`) parses + validates as-is under the same validator + exact pin the proto/daemon-api
# conformance suites use. `ciborium` builds the per-tag CBOR samples the grammar is checked against.
cddl-cat = "=0.7.1"
ciborium = { workspace = true }

[lints]
workspace = true
