[package]
name = "daemon-vhc-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = """
The host-side integration runner (architecture §6): wasmtime + simulated capability providers for
the PRODUCTION wasm blobs — whole-run integration gates, adversarial suites, trace-replay
regressions. It generalizes the A2 t2 join-run into reusable infrastructure: start a major-2 module
under the real host event-loop driver, journal it, then re-drive the recorded journal through the
§8.7 input-replay engine and assert every decision reproduces bit-for-bit.

It links host/* only and NEVER sdk/* — the SDK-side native twin is sdk/daemon-vhc-sim (§6, the
two-layer split on opposite sides of the wasm boundary). vhc_dep_check enforces the direction.
"""

[dependencies]
# The wasmtime sandbox + the major-2 event-loop driver, admission, the in-memory JournalSink, and
# the §8.7 replay engine (`replay_v2`). host/* -> host/* (allowed).
daemon-vhc-host = { workspace = true }
# The shared ABI vocabulary (event tags, channel table, stop reasons, outcome codes). contracts/*.
daemon-vhc-abi = { workspace = true }
# The signed control-plane wire (SignedMessage / SwarmMessage), envelope, blake3. contracts/*.
daemon-vhc-proto = { workspace = true }
# The consensus SDK layer (assignment math + — relocated at D2 from the dissolved
# daemon-vhc-coordinator — the pure `tick` state machine, `coordinator` module). The barrier
# harness re-derives worker windows with the same `assign_batches` the guests use, drives the
# native coordinator in-process ("native coordinator + wasm workers", refactor §6), AND runs the
# native `tick` as the D2 dual-compilation identity reference the wasm coordinator-quorum guest is
# compared against. TRACKED dependency-direction exception (xtask vhc_dep_check): host/* -> sdk/*
# is transitional — it retires as the whole-run harness re-seats onto the wasm coordinator and the
# native reference/assignment re-derivation moves to SDK-side vhc-sim.
daemon-vhc-sdk-consensus = { workspace = true }
blake3 = { workspace = true }
ciborium = { workspace = true }
# Typed harness errors (the D2 wasm-coordinator configuration seat's matrix refusals).
thiserror = { workspace = true }

[dev-dependencies]
# The failover drill (refactor §8/D2): the A1 journal + the D2 record archive / chain recovery
# the standby coordinator resumes from. host/* -> host/* (allowed), test-only.
daemon-vhc-observe = { workspace = true }
# The Phase-E upgrade-transaction drills (refactor §9): the session's `run_local_upgrade`
# orchestrator + `UpgradeSteps` seam driven over the real host primitives (quiesce/snapshot,
# admit_v2 re-admission, start_run_migrating). host/* -> host/* (architecture §7: TESTKIT → SESS),
# test-only.
daemon-vhc-session = { workspace = true }
# The Phase-E colocation-under-arbitration acceptance (refactor §9; decisions D6): the node's
# OwnerArbiter admits the trainer + verifier role-instances the tier-2 lane colocates.
# host/* -> host/* (allowed), test-only.
daemon-vhc-node = { workspace = true }

[lints]
workspace = true
