[package]
name = "daemon-vhc-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = """
The host-side integration runner (architecture §6): wasmtime + simulated capability providers for
the PRODUCTION wasm blobs — whole-run integration gates, adversarial suites, trace-replay
regressions. It generalizes the A2 t2 join-run into reusable infrastructure: start a major-2 module
under the real host event-loop driver, journal it, then re-drive the recorded journal through the
§8.7 input-replay engine and assert every decision reproduces bit-for-bit.

It links host/* only and NEVER sdk/* — the SDK-side native twin is sdk/daemon-vhc-sim (§6, the
two-layer split on opposite sides of the wasm boundary). vhc_dep_check enforces the direction.
"""

[dependencies]
# The wasmtime sandbox + the major-2 event-loop driver, admission, the in-memory JournalSink, and
# the §8.7 replay engine (`replay`). host/* -> host/* (allowed).
# `harness` exposes the host's whole-run coordinator drive (the testkit's coordinator seat is a
# re-export of it) — the testkit is wholesale harness tooling, so the feature is always on here.
daemon-vhc-host = { workspace = true, features = ["harness"] }
# The shared ABI vocabulary (event tags, channel table, stop reasons, outcome codes). contracts/*.
daemon-vhc-abi = { workspace = true }
# The signed control-plane wire (SignedMessage / VhcMessage), envelope, blake3. contracts/*.
daemon-vhc-proto = { workspace = true }
# The consensus SDK layer (assignment math + the shared coordinator types). The whole-run
# harness re-derives worker windows with the same `assign_batches` the guests use, and authors
# the genesis coordinator role's opaque config (`{state: CoordinatorState}`) + the typed
# `AuthorityConfig` topology — authoring vocabulary only; no native consensus drive exists (the
# coordinator runs exclusively as the sandboxed coordinator-quorum module). TRACKED
# dependency-direction exception (xtask vhc_dep_check): host/* -> sdk/* narrows to a
# contracts-crate move if the shared coordinator/authority types ever relocate.
daemon-vhc-sdk-consensus = { workspace = true }
blake3 = { workspace = true }
ciborium = { workspace = true }
# Typed harness errors (the D2 coordinator configuration seat's matrix refusals).
thiserror = { workspace = true }

[dev-dependencies]
# The shared guest-workspace builder every wasm-backed test suite in this crate goes through
# (reproducibility remap env + cross-process build lock live there, once). Test-only.
daemon-vhc-guest-build = { workspace = true }
# The failover drill (refactor §8/D2): the A1 journal + the D2 record archive / chain recovery
# the standby coordinator resumes from. host/* -> host/* (allowed), test-only.
daemon-vhc-observe = { workspace = true }
# The Phase-E upgrade-transaction drills (refactor §9): the session's `run_local_upgrade`
# orchestrator + `UpgradeSteps` seam driven over the real host primitives (quiesce/snapshot,
# admit re-admission, start_run_migrating). host/* -> host/* (architecture §7: TESTKIT → SESS),
# test-only. `harness` exposes the `SandboxedCoordinator` the consensus-replay lanes re-derive
# through (consensus never runs natively, even in verification).
daemon-vhc-session = { workspace = true, features = ["harness"] }
# The Phase-E colocation-under-arbitration acceptance (refactor §9; decisions D6): the node's
# OwnerArbiter admits the trainer + verifier role-instances the tier-2 lane colocates.
# host/* -> host/* (allowed), test-only.
daemon-vhc-node = { workspace = true }
# Test-only: the two v1-worker matrix combinations' `AbiUnsupportedMajor` refusal input is a synthetic
# ABI-major-1 wasm image hand-assembled in `tests/matrix_combinations.rs` (no vendored/recorded bytes, no
# soon-to-retire v1 guest crate) — the same `wasm-encoder` shape the host driver-selection tests
# use. Already resolved in Cargo.lock (a wasmtime/cranelift transitive), so it adds no new crate.
wasm-encoder = { workspace = true }

[lints]
workspace = true
