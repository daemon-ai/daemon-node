[package]
name = "daemon-vhc-coordinator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# Wave 2 keeps this crate a PURE LIBRARY: the coordinator `tick` state machine + its types, with no
# I/O. It depends only on the wasm-clean proto contract plus serde (derive) for the
# canonical-CBOR-serializable state — so `tick` stays byte-reproducible on the wasm32/zkVM
# coordinator substrate (§11.2, COORD-3). Errors are hand-rolled (no `thiserror`), matching the
# lean-contract convention. The runnable local coordinator (axum/WS) + its deps land in Wave 3
# (lane R owns `bins/`), which re-adds the server dependencies then. Root Cargo.toml is FROZEN and
# untouched.
daemon-vhc-proto = { workspace = true }
# The assignment math this native coordinator drives moved to the consensus SDK layer at D0
# (refactor §8/D0). This is a TRACKED dependency-direction exception (xtask vhc_dep_check):
# host/* -> sdk/* is transitional here and retires at D2, when this crate dissolves into
# `sdk-consensus` + `guests/coordinator-quorum` and native coordination moves to SDK-side
# `vhc-sim` (which may link sdk-consensus legitimately).
daemon-vhc-sdk-consensus = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
# Integer-only property testing of `tick` determinism (TDD PROTO-16). Dev-only: does not affect the
# crate's wasm-clean normal-dependency surface.
proptest = { workspace = true }

[lints]
workspace = true
