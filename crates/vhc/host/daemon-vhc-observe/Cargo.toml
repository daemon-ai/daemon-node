[package]
name = "daemon-vhc-observe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# The wire contract (message types, canonical codec, envelope, hashes).
daemon-vhc-proto = { workspace = true }
# The host resource model, for one job: validating the composed members a certification run's tag-0
# header records. A replay that read those values without checking their digests and cross-references
# would be re-driving a run from a record it had not authenticated, and the types that say what those
# members mean live there. host/* → host/* is a permitted direction.
daemon-vhc-resource = { workspace = true }
# The shared coordinator types + round message schemas the replay oracle carries (PROTO-20):
# `CoordinatorState` (the genesis-derived config the coordinator module is initialized with), the
# `Input` trace, and the decoded round messages the journal/desync/health oracles inspect. The
# oracle no longer re-runs a native `tick`: consensus is re-derived inside the sandboxed
# `coordinator-quorum` module through the `CoordinatorSandbox` seam (consensus never runs
# outside the sandbox, even in verification).
# EXPLICIT dependency-direction EXEMPTION (xtask vhc_dep_check): observe is harness/oracle
# TOOLING, not a production host crate — it replays and audits recorded runs, which requires
# decoding the SDK round schemas. It is never linked by the production node/worker/session graph.
daemon-vhc-sdk-consensus = { workspace = true }
# The crash-safe segmented journal SUBSTRATE (ABI §8: records, segments, sidecars, the
# commit-barrier store), extracted to its own schema-free crate so production crates can link the
# store without this crate's oracle tooling. Re-exported here under the original `journal::` paths;
# the archive/consensus/oracle/verifier tooling above it stays here.
daemon-vhc-journal = { workspace = true }
# The journal framing constants + `JOURNAL_CDDL` the grammar-conformance suite validates against.
daemon-vhc-abi = { workspace = true }
serde = { workspace = true }
# Structural decoding of the §12.1 signed wire frames a PRODUCTION journal records (tag-12/tag-4:
# `[envelope, payload, sig]`) — the wire-form capture extracts the inner `VhcMessage` payload
# without ever giving the outer frame a schema (the reconstruction path's discipline).
ciborium = { workspace = true }
# Node-side tool: observe uses std freely (std::io message-log framing) and follows its scaffold's
# `thiserror` errors. It is NOT on the wasm32 substrate path (proto + coordinator stay wasm-clean).
thiserror = { workspace = true }

[dev-dependencies]
# Journal grammar conformance: encode each record and validate it against `daemon_vhc_abi::JOURNAL_CDDL`
# under the same validator + exact pin the proto/daemon-api conformance suites use.
cddl-cat = "=0.7.1"
# The replay-oracle tests re-derive consensus inside the real `coordinator-quorum` module through
# the session crate's `SandboxedCoordinator` (consensus never runs natively, even in these
# tests). A dev-only edge; session depends on observe normally, so this is a dev-dependency cycle
# (permitted by cargo), never a normal-build edge.
daemon-vhc-session = { workspace = true, features = ["harness"] }

[lints]
workspace = true
