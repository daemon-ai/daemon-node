[package]
name = "daemon-vhc-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

# The recorded-run verification entry point (B2): replays `--observe` artifacts through the pure
# coordinator `tick` and asserts per-round consensus re-derives. Needs `harness` (observe + the
# coordinator shell) — it verifies offline from files, so it builds transport-free.
[[bin]]
name = "swarm-replay"
path = "src/bin/swarm-replay.rs"
required-features = ["harness"]

[features]
# `harness` exposes the in-process multi-peer test harness + the real `daemon-vhc-coordinator`
# pure `tick` loop driver (the impure shell that signs/publishes the coordinator's unsigned
# RoundOpen/RoundRecord outputs and feeds it signed peer messages + StorageReceipt evidence + scripted
# Clock inputs) to external crates. Kept out of the default build; the `tests/daemon-swarm-e2e` crate
# enables it. The crate's own unit tests reach the harness via `cfg(test)` (no feature needed).
harness = ["dep:daemon-vhc-observe"]
# (Phase-E sunset cleanup) The `iroh` feature is GONE: it layered the live-transport harness
# (`live_harness`) on `harness`, and that harness retired with the v1 driver at the sunset (it
# drove the v1 WasmBackend over the engine). The passthrough kept "external `--features iroh`
# invocations valid" — a back-compat accommodation the ratified no-backcompat posture removes;
# its only in-repo invoker was `daemon-swarm-e2e`'s equally dead `iroh` feature.

[dependencies]
daemon-vhc-proto = { workspace = true }
# The frozen ABI constants (event/outcome/quiesce-reason/stop-reason codes, the default control
# channel id) two consumers share: the production upgrade-transaction adapter
# (`upgrade::LiveUpgradeSteps`) drives the live pump with them (default build), and the
# `harness`-gated replay sandbox (the concrete `CoordinatorSandbox` that drives the wasm coordinator
# module under the host runtime) reads its stop-reason + candidate-driver constants. A contracts
# crate (links neither sdk/* nor host/*), so the session→abi edge is direction-safe.
daemon-vhc-abi = { workspace = true }
# The consensus SDK layer: assignment math (moved from the proto at D0, consumed by the retained v1
# RoundEngine) AND — relocated at D2 from the dissolved daemon-vhc-coordinator — the pure coordinator
# `tick` state machine (its `coordinator` module) the harness shell (`local_coordinator`) signs,
# publishes, and feeds. TRACKED dependency-direction exception (xtask vhc_dep_check): host/* -> sdk/*
# is transitional and is reviewed/retired as D2 re-seats the engine's consumers (the engine itself,
# and the harness shell, retire with the v1 driver at the Phase-E sunset).
daemon-vhc-sdk-consensus = { workspace = true }
daemon-vhc-net = { workspace = true }
# The A2 dependency INVERSION (refactor §5 A2; architecture §7: SESS → HOSTC): the session links
# the host runtime — never the reverse (the old daemon-vhc-host → daemon-vhc-session edge is gone;
# xtask's vhc_dep_check enforces the direction). `wasm_backend.rs` (the TrainerBackend seam over
# the wasm host) moved here with the inversion.
daemon-vhc-host = { workspace = true }
# The E1 checkpoint bridge (refactor §9; architecture §5.3): the state-dict ↔ safetensors converter
# wired into the checkpoint path so the typed `module` section is a portable, content-addressed
# safetensors serialization (host/* -> host/*, no sdk edge).
daemon-vhc-safetensors = { workspace = true }
# Observe drives the desync verdict (digest tally / `DesyncVerdict`, §9) the harness + checkpoint
# resync trigger consume. Node-side std tool, `harness`-gated so it stays off the default
# participant build. Path dep already in the frozen root `[workspace.dependencies]` (no root edit),
# and observe depends only on proto + coordinator (no cycle back to `daemon-vhc-session`).
daemon-vhc-observe = { workspace = true, optional = true }
tokio = { workspace = true }
# `futures::future::join_all` drives the barrier's bounded-concurrency payload fetch (engine.rs,
# `RoundEngine::with_download_scheduler`). Already a frozen `[workspace.dependencies]` entry.
futures = { workspace = true }
thiserror = { workspace = true }
# The harness `FaultyStore` implements the async `PayloadStore` trait (harness / test only, gated
# behind `cfg(any(test, feature = "harness"))`).
async-trait = { workspace = true }
# Worker protocol codec (§10.2) + manifest/backend wire shapes.
serde = { workspace = true }
ciborium = { workspace = true }
# The pre-tokenized corpus manifest is JSON (`manifest.json`, §8).
serde_json = { workspace = true }
# Per-shard content addressing in the manifest (blake3, §8).
blake3 = { workspace = true }
# Deterministic synthetic corpus + StubBackend fake "updates" and the xxh3-128 state digest (§5.6).
xxhash-rust = { workspace = true }

[dev-dependencies]
# Same as the coordinator: the `cfg(test)` harness build uses observe's `digest_tally` / `DesyncVerdict`
# (the desync trigger) even with the `harness` feature off.
daemon-vhc-observe = { workspace = true }
# The `[swarm]` config-section extraction test (§10.6) layers a figment the way the node config does;
# `test` adds `figment::Jail` for hermetic env fixtures. Test-only — the struct itself is serde-only.
figment = { workspace = true, features = ["test"] }

[lints]
workspace = true

[package.metadata.cargo-machete]
# `async-trait` is used only by the harness `FaultyStore` PayloadStore impl, gated behind
# `cfg(any(test, feature = "harness"))`, so it looks unused on the default (non-test) build path.
# (`daemon-vhc-abi` is NOT ignored: the `upgrade` adapter consumes it on the default build.)
ignored = ["async-trait"]
