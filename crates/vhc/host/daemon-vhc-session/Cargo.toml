[package]
name = "daemon-vhc-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

# The recorded-run verification entry point stays a LIBRARY capability
# (`harness::verify_observe_dir`, exercised by the observe gate): it re-derives a recorded run
# through the sandboxed coordinator module. The standalone `replay` dev binary folded onto the
# vhc-sim substrate as the `daemon-vhc-sim` `replay_check` example (D-5) — no stub/native runnable survives.

[features]
# `harness` exposes the in-process multi-peer test harness, the coordinator recording drive (the
# impure shell that signs/publishes the coordinator's unsigned round outputs and feeds it signed
# peer messages + storage-receipt evidence + scripted Clock inputs), the retained `RoundEngine`,
# and the typed checkpoint / upgrade machinery — everything that decodes SDK round schemas. Kept
# out of the default build: the production session surface (assess / attach / identity / keystore
# / protocol / data / config) routes opaque signed frames only and links no SDK schema crate
# (dep-check-enforced). The crate's own unit tests reach the harness via `cfg(test)`; external
# harness crates (testkit, e2e, observe's dev graph) enable the feature.
harness = [
    "dep:daemon-vhc-observe",
    "dep:daemon-vhc-sdk-consensus",
    "dep:daemon-vhc-guest-build",
    "daemon-vhc-host/harness",
]
# `live` exposes the role session's live transport-provider construction (`providers`): the WS
# control plane + the presigned R2 / filesystem content stores selected by the node-authored
# `SessionCredentials`. Off the default gate so a default build never compiles the WS/TLS tree;
# the worker binary's networked feature set enables it.
live = ["daemon-vhc-net/ws", "dep:daemon-egress"]
# `live-iroh` adds the dual-plane composition (WS + iroh gossip) to the live attach; the iroh
# transport secret stays a keystore reference.
live-iroh = ["live", "daemon-vhc-net/iroh"]
# (Phase-E sunset cleanup) The `iroh` feature is GONE: it layered the live-transport harness
# (`live_harness`) on `harness`, and that harness retired with the v1 driver at the sunset (it
# drove the v1 WasmBackend over the engine). The passthrough kept "external `--features iroh`
# invocations valid" — a back-compat accommodation the ratified no-backcompat posture removes;
# its only in-repo invoker was `daemon-vhc-e2e`'s equally dead `iroh` feature.

[dependencies]
# Structured diagnostics for the live role session + provider construction (a live session that
# emits nothing is undebuggable in a multi-process run). Events only, no subscriber — the binary
# (worker/node) installs the subscriber and picks the sink; `RUST_LOG` selects levels.
tracing = { workspace = true }
daemon-vhc-proto = { workspace = true }
# The frozen ABI constants (event/outcome/quiesce-reason/stop-reason codes, the default control
# channel id) two consumers share: the production upgrade-transaction adapter
# (`upgrade::LiveUpgradeSteps`) drives the live pump with them (default build), and the
# `harness`-gated replay sandbox (the concrete `CoordinatorSandbox` that drives the coordinator
# module under the host runtime) reads its stop-reason + candidate-driver constants. A contracts
# crate (links neither sdk/* nor host/*), so the session→abi edge is direction-safe.
daemon-vhc-abi = { workspace = true }
# The consensus SDK layer (round message schemas, assignment math, the pure coordinator `tick`,
# the typed checkpoint manifest + attestation vocabulary). OPTIONAL, enabled only by the
# `harness` feature: every consumer (`engine`, `checkpoint`, `upgrade`, `coordinator_shell`,
# `harness`, `replay_sandbox`, `receipt`) is harness machinery gated behind that feature, so the
# default production session graph carries no SDK schema crate (dep-check-enforced).
daemon-vhc-sdk-consensus = { workspace = true, optional = true }
daemon-vhc-net = { workspace = true }
# The SSRF-safe outbound HTTP client the live attach's presign plane rides. OPTIONAL — pulled in
# only by the `live` feature (the default session build stays network-free).
daemon-egress = { workspace = true, optional = true }
# The crash-safe segmented journal SUBSTRATE (ABI §8), schema-free by construction: the durable
# per-incarnation sink (`journal_home::DurableSink`) adapts its `Journal` onto the driver's
# dependency-inverted `JournalSink` seam — the production replacement for the in-memory sink.
daemon-vhc-journal = { workspace = true }
# The A2 dependency INVERSION (refactor §5 A2; architecture §7: SESS → HOSTC): the session links
# the host runtime — never the reverse (the old daemon-vhc-host → daemon-vhc-session edge is gone;
# xtask's vhc_dep_check enforces the direction). `wasm_backend.rs` (the TrainerBackend seam over
# the wasm host) moved here with the inversion.
daemon-vhc-host = { workspace = true }
# The `[DI-9]` admitted tuple's certification branch: the protocol builds the tuple's resource
# statement from an admission, which means canonically encoding the composed claim, aggregate, grant
# and reservation. host/* -> host/* is a permitted direction; the edge the model forbids is any
# guest-linked crate reaching the resource crate, which the dep-check enforces separately. Nothing of
# the resource vocabulary reaches the wire — what travels is bytes, digests and primitives.
daemon-vhc-resource = { workspace = true }
# The E1 checkpoint bridge (refactor §9; architecture §5.3): the state-dict ↔ safetensors converter
# wired into the checkpoint path so the typed `module` section is a portable, content-addressed
# safetensors serialization (host/* -> host/*, no sdk edge).
daemon-vhc-safetensors = { workspace = true }
# Observe drives the desync verdict (digest tally / `DesyncVerdict`, §9) the harness + checkpoint
# resync trigger consume. Node-side std tool, `harness`-gated so it stays off the default
# participant build. Path dep already in the frozen root `[workspace.dependencies]` (no root edit),
# and observe depends only on proto + coordinator (no cycle back to `daemon-vhc-session`).
daemon-vhc-observe = { workspace = true, optional = true }
# The shared guest-workspace builder (reproducibility remap env + cross-process build lock live
# there, once): the `harness`-gated replay sandbox builds the `coordinator-quorum` module through
# it. OPTIONAL — the default production session graph never shells cargo.
daemon-vhc-guest-build = { workspace = true, optional = true }
tokio = { workspace = true }
# `futures::future::join_all` drives the barrier's bounded-concurrency payload fetch (engine.rs,
# `RoundEngine::with_download_scheduler`). Already a frozen `[workspace.dependencies]` entry.
futures = { workspace = true }
thiserror = { workspace = true }
# The harness `FaultyStore` implements the async `PayloadStore` trait (harness / test only, gated
# behind `cfg(any(test, feature = "harness"))`).
async-trait = { workspace = true }
# Worker protocol codec (§10.2) + manifest/backend wire shapes.
serde = { workspace = true }
ciborium = { workspace = true }
# The pre-tokenized corpus manifest is JSON (`manifest.json`, §8).
serde_json = { workspace = true }
# Per-shard content addressing in the manifest (blake3, §8).
blake3 = { workspace = true }
# The certified per-run identity subsystem (architecture §4.3): CSPRNG seeds for base / per-run /
# transport keys, and zero-on-drop carriers for secret seed material (redaction by construction).
getrandom = { workspace = true }
zeroize = { workspace = true }
# Deterministic synthetic corpus + StubBackend fake "updates" and the xxh3-128 state digest (§5.6).
xxhash-rust = { workspace = true }

[dev-dependencies]
# Test-only re-statement of the normal `daemon-vhc-resource` edge, asking for the fixture feature:
# `tests/admitted_tuple.rs` builds the `[DI-9]` tuple's certification branch from a REAL composition,
# which needs an authenticated profile — the one input a test cannot fabricate. Dev-only by gate
# (`xtask vhc-dep-check` fails any production edge that enables it).
daemon-vhc-resource = { workspace = true, features = ["test-support"] }
# Same as the coordinator: the `cfg(test)` harness build uses observe's `digest_tally` / `DesyncVerdict`
# (the desync trigger) even with the `harness` feature off.
daemon-vhc-observe = { workspace = true }
# Same pattern: the `cfg(test)` build of the replay sandbox builds guests through the shared
# builder even with the `harness` feature off.
daemon-vhc-guest-build = { workspace = true }
# The `cfg(test)` builds of the harness-gated modules (engine/checkpoint/upgrade/harness/…) need
# the optional deps present without the feature: the SDK schema layer and the host's own
# harness-gated coordinator drive.
daemon-vhc-sdk-consensus = { workspace = true }
daemon-vhc-host = { workspace = true, features = ["harness"] }
# Keystore lifecycle tests need throwaway on-disk stores (same direct-version pattern as the
# node crate's dev-dep).
tempfile = "3"
# The `[vhc]` config-section extraction test (§10.6) layers a figment the way the node config does;
# `test` adds `figment::Jail` for hermetic env fixtures. Test-only — the struct itself is serde-only.
figment = { workspace = true, features = ["test"] }

[lints]
workspace = true

[package.metadata.cargo-machete]
# `async-trait` is used only by the harness `FaultyStore` PayloadStore impl, gated behind
# `cfg(any(test, feature = "harness"))`, so it looks unused on the default (non-test) build path.
# (`daemon-vhc-abi` is NOT ignored: the `upgrade` adapter consumes it on the default build.)
ignored = ["async-trait"]
