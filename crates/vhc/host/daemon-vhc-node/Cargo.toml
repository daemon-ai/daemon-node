[package]
name = "daemon-vhc-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The node-side vhc-training service: durable vhc.db state, worker supervision, and the SwarmApi surface."

[dependencies]
# The SwarmApi trait + wire DTOs + NodeEvent this service implements / emits (spec §10.4).
daemon-api = { workspace = true }
# The frozen worker protocol (Event/Command/Hardware/Eligibility) + the `[vhc]` config type.
daemon-vhc-session = { workspace = true }
# Run discovery + frozen-envelope fetch (A1): the `RegistryClient` (registry `GET /runs`,
# envelope presign+GET+blake3-verify) the `EgressRunDiscovery` seam wraps, so the join flow runs the
# worker's real §6.5 `AssessRun` before `JoinRun`. Default (no-iroh, no-ws) build — discovery rides
# `daemon_egress::EgressClient`; the WS control plane / iroh features stay off here.
daemon-vhc-net = { workspace = true }
# The training-worker supervisor this service owns (lane B3's crate; consumed read-only). The
# `WorkerControl` seam wraps it so the service is testable without a live worker subprocess.
daemon-vhc-supervisor = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
# vhc.db stores policy/eligibility as JSON and the windowed event log as JSON blobs.
serde_json = { workspace = true }
thiserror = { workspace = true }
# vhc.db: a separate SQLite file (spec §10.3), mirroring the daemon-auth `auth.db` precedent —
# bundled amalgamation + PRAGMA user_version migrations via rusqlite_migration.
rusqlite = { version = "0.37", features = ["bundled"] }
rusqlite_migration = { workspace = true }
# The arbiter's ledger keys carry the 32-byte run identity; a v1-era run (no genesis hash yet)
# uses blake3(RunLabel) as its node-local stand-in (decisions D6 wiring).
blake3 = { workspace = true }

[dev-dependencies]
tempfile = "3"
# Node-level acceptance for the live module-upgrade command surface (`tests/switch_module.rs`):
# it drives `WorkerControl::switch_module` over a REAL running worker instance (a real wasm
# migratable guest under the host runtime) through the production upgrade transaction
# (`daemon_vhc_session::upgrade`). Test-only edges — no runtime dependency-direction change.
daemon-vhc-host = { workspace = true }
daemon-vhc-proto = { workspace = true }
daemon-vhc-abi = { workspace = true }
ciborium = { workspace = true }

[lints]
workspace = true
