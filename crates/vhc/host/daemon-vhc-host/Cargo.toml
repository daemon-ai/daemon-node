[package]
name = "daemon-vhc-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

# The training worker (`daemon-vhc-worker`) was a `[[bin]]` target here through Phase A0;
# it split into its own `crates/vhc/bins/daemon-vhc-worker` crate at A2 per refactor §3/§11
# ("splits into `bins/daemon-vhc-worker` when A0 gives it real work") — a strictly mechanical move.
# Its tests/worker_protocol.rs integration test moved with it (CARGO_BIN_EXE resolution).

# A minimal, telemetry-free device-limits readout (fleet hardware validation). Cross-builds + LINKS
# under MinGW (unlike the full worker, whose always-on `sentry-rust-minidump` path pulls an
# unresolved UCRT symbol on windows-gnu — the archived cross-build validation finding). Runs the
# same `daemon_vhc_host::probe` code
# the worker's `Probe` path uses, so the reported DeviceLimits are identical to a live `Probe`.
[[bin]]
name = "daemon-vhc-probe"
path = "src/bin/daemon-vhc-probe.rs"

[dependencies]
daemon-vhc-proto = { workspace = true }
# The host side of the three-object resource model. Admission is one of the composition planner's four
# callers (`[DI-10]`: authoring validation, node admission, sealed-binary conformance, ceremony
# preflight), and the funnel composes the Physical Claim it authorizes rather than carrying a second
# implementation of the same arithmetic. host/* → host/* is a permitted direction; the dependency the
# model forbids is any guest-linked crate reaching this one, which the dep-check enforces separately.
daemon-vhc-resource = { workspace = true }
# The shared ABI contract (the major-2 constants, import-namespace
# vocabulary, candidate-selection helpers, and the split admission-refusal taxonomy). A0 uses it
# for driver selection (ABI §1.3) — promoted from a dev-dep (the `abi_surface` sync check) to a
# normal dep now that the runtime consumes the selection API. contracts/ crate: links neither
# sdk/* nor host/*, so the dependency-direction gate is unaffected.
daemon-vhc-abi = { workspace = true }
# Host worker runtime: the wasm module sandbox (wasmtime) + the training engine (Burn, ndarray
# backend + autodiff; NO GPU backends in the default gate) + content hashing for artifact / tensor
# digests (blake3, xxh3). swarm-training-spec.md §5.1, §10.1. Heavy trees on purpose: this crate is
# the worker fault domain and is built out-of-gate per backend lane in the real product.
wasmtime = { workspace = true }
burn = { workspace = true }
# Phase-C `compute@2` (track C1, decisions D8 / ABI §15): the wire is `CBOR(burn_ir::OperationIr)`
# at the pinned Burn version and the host reuses the `burn-router` runner dispatch as the op
# inventory (`src/compute.rs`). Already resolved at 0.21.0 in Cargo.lock (transitive under `burn`),
# so these are lock-neutral edges (see the root workspace note). burn-ndarray is the tier-1 backend;
# wgpu/cuda ride the same `BackendIr` seam behind the existing feature lanes.
burn-ir = { workspace = true }
burn-router = { workspace = true }
burn-backend = { workspace = true }
burn-ndarray = { workspace = true }
blake3 = { workspace = true }
xxhash-rust = { workspace = true }
thiserror = { workspace = true }
# The CBOR codec for the manifest/config contract (ABI §6.1/§6.2). (The daemon-vhc-det dep
# retired with the bridge's det_* acceleration dispatch: no host-executed det-kernel surface
# remains — det math runs exclusively in-guest via that crate compiled to wasm.)
serde = { workspace = true }
ciborium = { workspace = true }
# The coordinator drive seat (`coordinator` module) decodes the run's typed `AuthorityConfig`
# AND the SDK round messages (`published()`/`next_message()` decode coordinator decisions), so
# both the module and this dep are HARNESS machinery: OPTIONAL, enabled only by the `harness`
# feature. The default host build carries no SDK schema crate (dep-check-enforced) — the
# production pump path routes opaque frames and never inspects a decision.
daemon-vhc-sdk-consensus = { workspace = true, optional = true }
# (A2 dependency INVERSION, refactor §5 A2 item 3): the daemon-vhc-session dep is GONE — the host
# no longer links run policy; the session links the host (architecture §7: SESS → HOSTC), and
# `wasm_backend.rs` (the TrainerBackend seam impl) moved to the session with it. The session
# remains a DEV-dependency only (the v2 parity/data-fetch suites need its protocol types), which
# cargo permits alongside the session→host normal edge; xtask's vhc_dep_check enforces the runtime
# direction.
# (A2 worker-bin split): daemon-vhc-net, daemon-provision, tokio, daemon-telemetry, and the
# optional daemon-egress/async-trait pair were worker-bin-only deps — they moved to
# `crates/vhc/bins/daemon-vhc-worker` with the bin. The lib keeps none of them.
# The CUDA driver API for the `BackendKind::Cuda` device probe: total dedicated-VRAM query via
# `cuDeviceTotalMem`. OPTIONAL — pulled ONLY by the `cuda` feature, so a
# default `cargo build`/`test`/`deny` never sees it. cudarc `0.19.8` is ALREADY resolved in the
# committed `Cargo.lock` (cubecl-cuda 0.10 pulls it under `burn/cuda`); this edge adds only the
# `driver` marker feature (`= []`, no dep edge), so NO new crate/version/source enters the graph — the
# only lock change is the one `"cudarc 0.19.8"` edge line on this package node, and `cargo deny` is a
# no-op. A lane-owned, off-default-gate dep (the standing dep rule; STOP-and-report only on a NEW
# dep). `default-features = false` avoids requesting cudarc's cublas/curand/nvrtc extras; cubecl
# already enables the dlopen path via feature unification (host libcuda loaded at runtime, no
# toolkit at build — the archived CUDA container validation finding).
cudarc = { version = "0.19.8", optional = true, default-features = false, features = ["driver"] }
# The compute runtime trait, for ONE call: reading the backend allocator's occupancy at a phase
# boundary (`HostCompute::sample_allocator`). Every workspace, pooling, compilation and staging term
# in a Backend Execution Profile has to be calibrated against that reading, and nothing in the tree
# took it before, so no run left an allocator record on any backend.
#
# Lock-neutral by the standing dep rule: `cubecl-runtime 0.10.0` is ALREADY resolved in the committed
# lock (burn's wgpu and cuda backends both pull it), so this compiles a crate the lock already pins
# and adds no third-party dependency to the tree. Gated behind the device features, so a default
# build never compiles it.
cubecl-runtime = { version = "0.10.0", optional = true, default-features = false }
# The Linux device lane's own statement of supply: `VK_EXT_memory_budget` on the device-local heap the
# runtime allocates from, plus that heap's advertised size. Windows and macOS each have a platform
# budget query (DXGI local budget, Metal recommended working set) and Linux did not, which left the
# capability report deriving supply statically from sysfs totals — a figure that can exceed the heap
# the driver will actually serve allocations from.
#
# Lock-neutral by the standing dep rule: `ash 0.38` is ALREADY resolved in the committed lock (wgpu's
# Vulkan backend pulls it), so this compiles a crate the lock already pins and adds no third-party
# dependency. `loaded` is the default and is what we want — the loader is dlopen'd at runtime, so a box
# without Vulkan reports a typed absence instead of failing to start. Gated behind the wgpu feature and
# `cfg(target_os = "linux")` in code, so a default build never compiles it.
ash = { version = "0.38", optional = true }

# Windows GPU-memory probe (swarm-windows-vram-design.md §2): DXGI `GetDesc3`/`QueryVideoMemoryInfo`
# + D3D12 `CheckFeatureSupport(ARCHITECTURE1)` + `GlobalMemoryStatusEx`. Target-gated so it never
# enters the Linux/macOS build; consumes the reserved root `windows = "0.62"` workspace entry
# (a lane-owned target/feature edit — no root Cargo.toml change). Feature modules per design §4
# (Threading omitted — the §3 budget-change event is not wired at probe time). Compiles for
# `x86_64-pc-windows-gnu` (MinGW) as well as msvc.
# Portable free-disk probe (`statvfs`) on unix (Linux + macOS): `libc` is already resolved in the
# committed Cargo.lock (a broad transitive), so this is a lock-neutral, lane-owned edge — no new
# third-party crate enters the graph. Used ONLY by the scoped-`unsafe` `probe::unix_ffi` module.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_System_SystemInformation",
    # `GetDiskFreeSpaceExW` — the Windows free-disk probe (the trainer lane-floor fix).
    "Win32_Storage_FileSystem",
] }

# Per-backend lane selection (spec §10.1). These features only toggle burn's *dependency* backend
# features — the compute@2 runner selects the admitted backend at run time. burn's `std` +
# `ndarray` + `autodiff` are always on (the root workspace dep), so `cpu` (default) and `burn-ndarray`
# both compile the current CPU/ndarray+autodiff graph; `wgpu` additionally pulls burn-wgpu (cubecl +
# wgpu 29, Vulkan/RADV at runtime via the flake). Kept out of the default gate: `wgpu` is opt-in, so a
# default `cargo build`/`test`/`deny` never compiles the GPU tree.
[features]
default = ["cpu"]
# The CPU (det-lane fp32) lane — current MVP behavior, no extra backend deps.
cpu = []
# burn with the ndarray backend + autodiff — the G1 native lane (burn-ndarray is already on via the
# root dep; the explicit toggle documents/pins the lane and makes `--features burn-ndarray` a no-op-
# safe alias for the CI gate).
burn-ndarray = ["burn/ndarray"]
# burn with the wgpu backend (cubecl + wgpu 29; targets Vulkan/RADV) — the G2 GPU lane. Opt-in only.
wgpu = ["burn/wgpu", "dep:cubecl-runtime", "dep:ash"]
# (A2 worker-bin split): the `vhc-net` feature (the A3 live coordinator attach) moved to
# `crates/vhc/bins/daemon-vhc-worker` with the bin — it gated only worker-binary plumbing
# (`live.rs`); the host lib has no vhc-net code.
# burn with the CUDA backend (cubecl-cuda + cudarc; driver-API + NVRTC JIT at runtime) — the
# discrete-NVIDIA (RunPod-4090-validated) lane. Opt-in only, and a LANE-OWNED edit by the standing
# dep rule: burn-cuda/cubecl-cuda/cudarc are ALREADY resolved in the committed Cargo.lock (verified
# byte-unchanged when this feature was first enabled on the RunPod box), so no new third-party dep
# enters the tree — the feature only compiles crates the lock already pins. Runtime needs the host
# NVIDIA driver (libcuda, loads clean under nix glibc — cuInit verified on the 4090 container) +
# libnvrtc (absent from the RunPod container; provided by the `.#cuda-train` devshell — the
# archived CUDA container validation findings). The `BackendKind::Cuda` engine arm is wired behind
# this feature: `dep:cudarc` adds the driver-API VRAM probe (lock-neutral — see the cudarc dep
# note above). Opt-in only.
cuda = ["burn/cuda", "dep:cudarc", "dep:cubecl-runtime"]
# The whole-run coordinator drive seat (`coordinator` module): starts the coordinator blob under
# the real driver and signs/verifies/decodes its round decisions — harness machinery for the
# in-process whole-run suites (testkit, session harness, worker self-driven join). Off the default
# build so the production host carries no round vocabulary.
harness = ["dep:daemon-vhc-sdk-consensus"]

[dev-dependencies]
# Test-only re-statement of the normal `daemon-vhc-resource` edge above, asking for the fixture
# feature: `tests/resource_authority_assembly.rs` assembles a real `ResourceAuthority`, which means
# selecting an authenticated profile out of a stocked store — machinery the resource crate keeps
# private precisely so no shipping binary can mint its own trust. Under resolver 2 a dev-dependency's
# features reach test targets only, so the production build of this crate is unaffected; `xtask
# vhc-dep-check` fails if any non-dev edge in the workspace enables `test-support`.
daemon-vhc-resource = { workspace = true, features = ["test-support"] }
# The shared guest-workspace builder every wasm-backed test suite in this crate goes through
# (reproducibility remap env + cross-process build lock live there, once). Test-only.
daemon-vhc-guest-build = { workspace = true }
# The `cfg(test)` builds of the harness-gated coordinator module need the optional SDK schema dep
# present without the feature (same pattern as the session crate's dev-deps).
daemon-vhc-sdk-consensus = { workspace = true }
# Test-only: the A2 event-loop end-to-end test (`tests/event_loop.rs`) journals through the
# REAL A1 crash-safe segmented substrate by adapting `daemon_vhc_observe::journal::Journal` onto
# the driver's `JournalSink` seam. A host→host dev edge (observe is host-side); the runtime
# dependency direction stays observe → host (the replay verifiers drive modules through the host
# runtime), which A2's verifier wiring adds — never the reverse as a normal dep.
daemon-vhc-observe = { workspace = true }
# Test-only since the A2 inversion: the v2 data-fetch suite consumes the session's data/protocol
# types. A dev-dep beside the session→host normal edge is cargo-legal and carries no runtime
# direction. `harness` because the legacy JSON corpus pipeline (`daemon_vhc_session::data`) the
# fetch suite builds its fixtures from is quarantined behind that feature — the production corpus
# contract is chunk-addressed, and no default session build exposes the JSON manifest.
daemon-vhc-session = { workspace = true, features = ["harness"] }
# Test-only: hand-built wasm fixtures (the driver-selection negative tests + the synthetic
# ABI-major-1 refusal input) are assembled with `wasm-encoder` — precise control over import
# namespaces + the `da_abi` constant, with no wasm32 toolchain or guest workspace in the tier-1
# lane. Already resolved in Cargo.lock (a wasmtime/cranelift transitive), so this dev-dep adds no
# new crate to the graph.
wasm-encoder = { workspace = true }
# Test-only: the det-state conformance fixtures (`tests/state_ops.rs`) are hand-authored WAT —
# behavioral guests (event loops + state ops + publishes) are legible as text where the
# wasm-encoder builder pattern is not, and the tier-1 lane stays free of the wasm32 toolchain
# and the guest workspace (real-guest state-op conformance through the SDK lands with the
# trainer wave, which owns guest re-pins). Same wasm-tools family/version as wasm-encoder.
wat = { workspace = true }
# Test-only: the trainer-goldens bundle's `expected.json` (pins + recorded digests/schedule) is
# JSON; the reproduction tests parse it. Already a workspace pin.
serde_json = { workspace = true }
# (Phase-E sunset) the host->SDK dev-dep for the v1 oracle/reference/determinism harnesses was
# REMOVED with those harnesses (decisions D5). The `daemon-vhc-sdk-profiles` dev-dep (the NATIVE
# lowering-oracle half of the retired trainer parity harness) was removed with the v1 parity oracle
# retirement: the trainer-goldens lane reproduces the trainer over its own recorded bundle and
# needs no native profile A/B.
# (A2 worker-bin split): the daemon-vhc-supervisor + daemon-common dev-deps served only
# tests/worker_protocol.rs, which moved to `crates/vhc/bins/daemon-vhc-worker` with the bin.
# Test-only: the `compute@2` conformance harness (`tests/compute_conformance.rs`) impls the
# guest-side `burn_router::RunnerChannel`/`RunnerClient` routing every op through the production
# `ComputeRunner`, and `read_tensor_async` returns `burn_std::future::DynFut`. Already in the lock
# (transitive under burn-router); a dev-only edge, no new crate enters the graph.
burn-std = { workspace = true }

[lints]
workspace = true

[package.metadata.cargo-machete]
# `wasmtime` (host runtime) is used; `burn` is the compute engine. Standing note: burn's default
# (ndarray+autodiff) tree could move to a feature-gated / lane-split build off the default gate;
# deferred so far to avoid a full wasmtime recompile.
ignored = ["wasmtime", "burn"]
