[package]
name = "daemon-vhc-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "daemon-vhc"
path = "src/bin/daemon-vhc.rs"

# The Wave-3 training worker: speaks the frozen `daemon_vhc_session::protocol` over the length-framed
# stdio cut and drives `WasmBackend` (spec §10.2). The node process never links this binary's engine.
# Split into `main` (dispatch) + `backend` (probe/assess, G2) + `transport` (JoinRun round loop, B3)
# modules so the Wave-3 A/B lanes do not collide on one file (swarm-p1-ledger.md).
[[bin]]
name = "daemon-vhc-worker"
path = "src/bin/daemon-vhc-worker/main.rs"

# A minimal, telemetry-free device-limits readout (C2 fleet validation). Cross-builds + LINKS under
# MinGW (unlike the full worker, whose always-on `sentry-rust-minidump` path pulls an unresolved
# UCRT symbol on windows-gnu — see swarm-ledger-p2-c2). Runs the same `daemon_vhc_host::autotune` probe
# the worker's `Probe` path uses, so the reported DeviceLimits are identical to a live `Probe`.
[[bin]]
name = "daemon-vhc-probe"
path = "src/bin/daemon-vhc-probe.rs"

[dependencies]
daemon-vhc-proto = { workspace = true }
# The shared ABI contract (frozen `tabi@1` vocabulary + the v2 constants, import-namespace
# vocabulary, candidate-selection helpers, and the split admission-refusal taxonomy). A0 uses it
# for driver selection (ABI §1.3) — promoted from a dev-dep (the `abi_surface` sync check) to a
# normal dep now that the runtime consumes the selection API. contracts/ crate: links neither
# sdk/* nor host/*, so the dependency-direction gate is unaffected.
daemon-vhc-abi = { workspace = true }
# Host worker runtime: the wasm module sandbox (wasmtime) + the training engine (Burn, ndarray
# backend + autodiff; NO GPU backends in the default gate) + content hashing for artifact / tensor
# digests (blake3, xxh3). swarm-training-spec.md §5.1, §10.1. Heavy trees on purpose: this crate is
# the worker fault domain and is built out-of-gate per backend lane in the real product.
wasmtime = { workspace = true }
burn = { workspace = true }
blake3 = { workspace = true }
xxhash-rust = { workspace = true }
thiserror = { workspace = true }
# The shared fixed-order fp32 det-lane kernels (bit-exact sim ≡ host, ABI §5.9) + the CBOR codec for
# the manifest/config contract (ABI §6.1/§6.2). daemon-vhc-det is zero-dep; serde/ciborium are already pins.
daemon-vhc-det = { workspace = true }
serde = { workspace = true }
ciborium = { workspace = true }
# The R↔E seam (`TrainerBackend`) + the frozen node↔worker wire (`daemon_vhc_session::protocol`), lane R
# (§10.1: `daemon-vhc-host` depends on `daemon-vhc-session`). `WasmBackend` implements the trait; the
# worker binary implements the child side of the protocol. No cycle: `daemon-vhc-session` has no dep on
# `daemon-vhc-host`. Path dep already declared in the frozen root manifest — no root/deny/flake change.
daemon-vhc-session = { workspace = true }
# The envelope artifact plane (`ArtifactResolver`, `file://` blake3-verified) the worker uses to
# fetch its experiment module from the frozen envelope's artifact map (§8). Path dep already in the
# frozen root manifest; net depends only on proto (no cycle). Used by the worker bin target.
daemon-vhc-net = { workspace = true }
# The length-framed `CutChannel` stdio transport the `daemon-vhc-worker` binary speaks (same
# supervision contract as the other coprocessor workers, §10.2). Used by the bin target only.
daemon-provision = { workspace = true }
# Async runtime for the `daemon-vhc-worker` binary's stdio command/event loop. Bin target only.
tokio = { workspace = true }
# Consent-gated crash reporting for the `daemon-vhc-worker` binary (panics + native minidumps —
# the worker links heavy native engine trees, so a segfault is a real failure mode). Bin target
# only; a runtime no-op unless the spawning node injected a DSN + `DAEMON_CRASH_CONSENT=1`.
daemon-telemetry = { workspace = true }
# The SSRF-safe outbound HTTP client the `R2Store`/`HttpPresignClient` payload plane rides (A3 live
# attach). OPTIONAL — pulled in only by the `swarm-net` feature (which also turns on
# `daemon-vhc-net/{ws,iroh}`); the default worker build never links it. Already a
# `[workspace.dependencies]` entry (daemon-vhc-net uses it) — no root/deny/flake change.
daemon-egress = { workspace = true, optional = true }
# `#[async_trait]` for the worker's concrete `PayloadStore` impl (the R2/Fs store enum, A3 live
# attach). OPTIONAL — pulled in only by `swarm-net`; already a `[workspace.dependencies]` entry.
async-trait = { workspace = true, optional = true }
# The CUDA driver API for the P3 Lane-G `BackendKind::Cuda` device probe: total dedicated-VRAM query
# via `cuDeviceTotalMem` (swarm-ledger-p3-g D3). OPTIONAL — pulled ONLY by the `cuda` feature, so a
# default `cargo build`/`test`/`deny` never sees it. cudarc `0.19.8` is ALREADY resolved in the
# committed `Cargo.lock` (cubecl-cuda 0.10 pulls it under `burn/cuda`); this edge adds only the
# `driver` marker feature (`= []`, no dep edge), so NO new crate/version/source enters the graph — the
# only lock change is the one `"cudarc 0.19.8"` edge line on this package node, and `cargo deny` is a
# no-op. A lane-owned, off-default-gate dep (the C2 dep rule; STOP-and-report only on a NEW dep).
# `default-features = false` avoids requesting cudarc's cublas/curand/nvrtc extras; cubecl already
# enables the dlopen path via feature unification (host libcuda loaded at runtime, no toolkit at
# build — swarm-ledger-p2-c2).
cudarc = { version = "0.19.8", optional = true, default-features = false, features = ["driver"] }

# Windows GPU-memory probe (swarm-windows-vram-design.md §2): DXGI `GetDesc3`/`QueryVideoMemoryInfo`
# + D3D12 `CheckFeatureSupport(ARCHITECTURE1)` + `GlobalMemoryStatusEx`. Target-gated so it never
# enters the Linux/macOS build; consumes the Wave-0 reserved root `windows = "0.62"` workspace entry
# (a lane-owned target/feature edit — no root Cargo.toml change). Feature modules per design §4
# (Threading omitted — the §3 budget-change event is not wired at probe time). Compiles for
# `x86_64-pc-windows-gnu` (MinGW) as well as msvc.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_System_SystemInformation",
] }

# Per-backend lane selection (spec §10.1). These features only toggle burn's *dependency* backend
# features — no code path changes this wave (Wave-0 scaffold): the `OpBackend` seam is still the
# `CpuBackend` fp32 fake; G1/G2 wire `BurnBackend` behind these lanes in Waves 1–2. burn's `std` +
# `ndarray` + `autodiff` are always on (the root workspace dep), so `cpu` (default) and `burn-ndarray`
# both compile the current CPU/ndarray+autodiff graph; `wgpu` additionally pulls burn-wgpu (cubecl +
# wgpu 29, Vulkan/RADV at runtime via the flake). Kept out of the default gate: `wgpu` is opt-in, so a
# default `cargo build`/`test`/`deny` never compiles the GPU tree.
[features]
default = ["cpu"]
# The CPU (det-lane fp32) lane — current MVP behavior, no extra backend deps.
cpu = []
# burn with the ndarray backend + autodiff — the G1 native lane (burn-ndarray is already on via the
# root dep; the explicit toggle documents/pins the lane and makes `--features burn-ndarray` a no-op-
# safe alias for the CI gate).
burn-ndarray = ["burn/ndarray"]
# burn with the wgpu backend (cubecl + wgpu 29; targets Vulkan/RADV) — the G2 GPU lane. Opt-in only.
wgpu = ["burn/wgpu"]
# The A3 live coordinator attach: turn on daemon-vhc-net's WS client + iroh gossip transport so the
# worker's JoinRun path runs a real `RoundEngine` over `DualPlane(WsControlPlane, IrohGossip)` +
# R2/Fs payload store (the ledger-sequenced dep-graph change). `daemon-vhc-net` is ALREADY a
# (default-feature) dep for the `file://` ArtifactResolver; this feature only enables its `ws`+`iroh`
# cargo features. OFF the default gate so a default `cargo build`/`test`/`deny` never compiles the
# WS/TLS/iroh/QUIC tree — verify with `cargo tree -e features -i daemon-vhc-net`. WS-only is the
# T0 baseline (iroh stays runtime-optional inside the feature too: absent iroh credentials → the
# bare `WsControlPlane`).
swarm-net = ["daemon-vhc-net/ws", "daemon-vhc-net/iroh", "dep:daemon-egress", "dep:async-trait"]
# burn with the CUDA backend (cubecl-cuda + cudarc; driver-API + NVRTC JIT at runtime) — the C2/P2
# RunPod-4090 lane. Opt-in only, and a LANE-OWNED edit by the ledger rule: burn-cuda/cubecl-cuda/
# cudarc are ALREADY resolved in the committed Cargo.lock (verified byte-unchanged when this feature
# was first enabled on the RunPod box), so no new third-party dep enters the tree — the feature only
# compiles crates the lock already pins. Runtime needs the host NVIDIA driver (libcuda, loads clean
# under nix glibc — cuInit verified on the 4090 container) + libnvrtc (absent from the RunPod
# container; provided by the `.#cuda-train` devshell — see swarm-ledger-p2-c2/c3). The P3 Lane-G
# `BackendKind::Cuda` engine arm is wired behind this feature (swarm-ledger-p3-g): `dep:cudarc` adds
# the driver-API VRAM probe (lock-neutral — see the cudarc dep note above). Opt-in only.
cuda = ["burn/cuda", "dep:cudarc"]

[dev-dependencies]
# Test-only: hand-built wasm fixtures (the driver-selection negative tests) are assembled with
# `wasm-encoder` — precise control over import namespaces + the `da_abi` constant, with no
# wasm32 toolchain or guest workspace in the tier-1 lane. Already resolved in Cargo.lock (a
# wasmtime/cranelift transitive), so this dev-dep adds no new crate to the graph.
wasm-encoder = { workspace = true }
# Test-only: the A0 frozen fixture's `expected.json` (pins + transcript) is JSON for human review;
# the replay test parses it. Already a workspace pin.
serde_json = { workspace = true }
# Test-only: the guest-lifecycle / parity tests build the `TinyLlamaCfg` the wasm guest parses.
# `sim` compiles the SDK's `models`/`profiles` (config types) natively for the tests; never a
# runtime edge (the host does not link the guest SDK). NOTE: this remaining host->SDK dev-dep is a
# tracked dependency-direction exception (model presets leave the SDK for `guests/` in Phase C).
daemon-vhc-sdk = { path = "../../sdk/daemon-vhc-sdk", features = ["sim"] }
# Test-only: the node-side supervisor drives the real `daemon-vhc-worker` subprocess through the
# frozen worker protocol (`tests/worker_protocol.rs`). Path dep between workspace members — no root
# edit — and `daemon-vhc-supervisor` does not depend on `daemon-vhc-host`, so it is a clean dev-dep.
daemon-vhc-supervisor = { workspace = true }
# Test-only: `SessionId` for the lower-level direct-subprocess round-loop test (spawns the worker via
# `daemon_provision` and drives the protocol to observe `RoundOutcome`).
daemon-common = { workspace = true }
# Test-only (M2 reference-parity harness): the state-dict ↔ safetensors converter (M1 seam 4) the
# parity tests use to compare the tabi path's and the burn reference's weights. Already a
# `[workspace.dependencies]` entry (added at Merge 2) — a dev-dep on an existing workspace dep, no
# root/deny/flake change.
daemon-vhc-safetensors = { workspace = true }

[lints]
workspace = true

[package.metadata.cargo-machete]
# `wasmtime` (host runtime) is used; `burn` is the Wave-2 `OpBackend` engine (declared now, wired
# then — the CPU fake needs no burn). NOTE (Merge 1): burn should move to a feature-gated / lane-split
# build off the default gate (program ledger); deferred this wave to avoid a full wasmtime recompile.
ignored = ["wasmtime", "burn"]
