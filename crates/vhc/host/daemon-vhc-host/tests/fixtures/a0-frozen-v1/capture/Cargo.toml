# The A0 frozen-fixture CAPTURE crate (refactor §5 A0 "capture command").
#
# This is a deliberately detached, standalone workspace (the empty [workspace] table below): it is
# NOT a member of the daemon-node workspace, and its dependencies point BY PATH into the immutable
# PRE-REFACTOR tree (`swarm-p3-integration`, commit 6706fda — the pre-Phase-0 crate names
# `daemon-train`/`daemon-swarm-run`/`daemon-swarm-proto`/`daemon-train-sdk`), so the captured
# transcript is produced by the exact pre-refactor v1 driver, not by the renamed tree under test.
# The pre-refactor tree is never modified: this crate only reads its sources/artifacts and builds
# in its (warm) target dir via the devShell-pinned CARGO_TARGET_DIR.
#
# Layout requirement: the pre-refactor worktree must sit at `../swarm-p3-integration` relative to
# this checkout's parent (i.e. both are worktrees under one directory) — see the ../README.md
# capture command.
[package]
name = "a0-fixture-capture"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
daemon-train = { path = "../../../../../../../../../swarm-p3-integration/crates/coprocessor/daemon-train" }
daemon-swarm-run = { path = "../../../../../../../../../swarm-p3-integration/crates/swarm/daemon-swarm-run" }
daemon-swarm-proto = { path = "../../../../../../../../../swarm-p3-integration/crates/contracts/daemon-swarm-proto" }
daemon-train-sdk = { path = "../../../../../../../../../swarm-p3-integration/crates/contracts/daemon-train-sdk", features = ["sim"] }
blake3 = "1"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
