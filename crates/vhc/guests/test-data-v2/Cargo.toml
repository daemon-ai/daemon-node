[package]
name = "test-data-v2"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
ciborium = "0.2"
# The plan format + its canonical encoder. Every module emits its own Logical Resource Plan;
# a plan written down anywhere but inside the module it describes is a second source.
daemon-vhc-proto = { path = "../../contracts/daemon-vhc-proto" }
# The SDK bindings under test (data_fetch/read_buffer/…) + the corpus-windowing policy layer
# (Manifest::locate decides the byte range the module fetches — windowing is MODULE policy).
daemon-vhc-sdk = { path = "../../sdk/daemon-vhc-sdk" }
