[package]
name = "tiny-llama"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
daemon-vhc-sdk = { path = "../../sdk/daemon-vhc-sdk" }
# The guest-side Burn compute tier: Autodiff<HostBackend> over the compute@2 shim (C1).
daemon-vhc-sdk-compute = { path = "../../sdk/daemon-vhc-sdk-compute" }
# The re-expressed comm/optimizer profiles (C3a): det-lane ingest runs IN-GUEST with zero host
# support (the daemon-vhc-det compatibility path, architecture §3.2).
daemon-vhc-sdk-profiles = { path = "../../sdk/daemon-vhc-sdk-profiles" }
# Round choreography as library code (BarrierRound) — wasm-clean.
daemon-vhc-sdk-rounds = { path = "../../sdk/daemon-vhc-sdk-rounds" }
# The round message schemas + state-digest schedule (moved out of the proto with the round-vocabulary move:
# round vocabulary is SDK/guest territory, the proto is mechanism-only).
daemon-vhc-sdk-consensus = { path = "../../sdk/daemon-vhc-sdk-consensus" }
daemon-vhc-proto = { path = "../../contracts/daemon-vhc-proto" }
# The bit-exact fp32 kernels — the guest expands seed-derived init through the same dual-compiled
# distribution the host/genesis pin (§6.1a); linked directly (wasm-clean, zero-dependency).
daemon-vhc-det = { path = "../../contracts/daemon-vhc-det" }
burn = { version = "=0.21.0", default-features = false, features = ["std", "autodiff"] }
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
