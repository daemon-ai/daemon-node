[package]
name = "test-compute-v2"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
daemon-vhc-sdk = { path = "../../sdk/daemon-vhc-sdk" }
# The guest-side Burn compute tier: HostBackend + Autodiff<HostBackend> over the compute@2 shim.
daemon-vhc-sdk-compute = { path = "../../sdk/daemon-vhc-sdk-compute" }
# The pinned wire IR (scenario guests hand-build TensorIr for the negative paths).
burn-ir = { version = "=0.21.0", default-features = false }
burn = { version = "=0.21.0", default-features = false, features = ["std", "autodiff"] }
ciborium = "0.2"
