[package]
name = "test-bridge-v2"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# The §2.5 tabi@1-bridge-under-major-2 conformance guest (A2 choreography move): a v2 event-loop
# module that ALSO links the frozen tabi@1 vocabulary — registration in da_init, tensor ops inside
# event slices, the recorded scalar readout published as its proof. Config byte 0 selects the
# lane: 0 = happy path; 1 = registration inside a slice (⇒ PhaseViolation, §2.5 rule 1);
# 2 = a slice-class handle retained across a slice boundary (⇒ StaleHandle, §7.1/§7.3).
[lib]
crate-type = ["cdylib"]

[dependencies]
ciborium = "0.2"
