[package]
name = "tiny-llama-v2"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# TinyLlama on BarrierRound under the major-2 event loop (refactor §5 A2 acceptance): the SAME
# SDK model + profile math as the v1 `tiny-llama` guest (`models::TinyLlama`, frozen tabi@1 ops
# via the §2.5 bridge), with the round CHOREOGRAPHY relocated in-guest as
# `BarrierRound<TinyLlamaRound, HostStaged>` — batches arrive host-staged (read_back kind 1),
# committed updates host-staged (kind 2). The v1 guest is untouched (its bytes stay pinned);
# this crate is the control-inversion twin the det-digest parity lane compares against it.
[lib]
crate-type = ["cdylib"]

[dependencies]
daemon-vhc-sdk = { path = "../../sdk/daemon-vhc-sdk" }
daemon-vhc-sdk-v2 = { path = "../../sdk/daemon-vhc-sdk-v2" }
daemon-vhc-sdk-rounds = { path = "../../sdk/daemon-vhc-sdk-rounds" }
daemon-vhc-proto = { path = "../../contracts/daemon-vhc-proto" }
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
