[package]
name = "daemon-pake"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# SPAKE2-P256-SHA256-HKDF-HMAC (RFC 9382) for LAN pairing (daemon-pairing-spec.md §3): a small
# in-workspace implementation over the audited RustCrypto primitives, gated by the RFC 9382
# Appendix B test vectors. In-workspace by spec decision: no maintained Rust SPAKE2 crate covers
# this suite with adoption worth trusting (`pakery-spake2` was explicitly rejected pending human
# review). The C++ app-side implementation replays this crate's transcript fixture.
[dependencies]
hkdf = { workspace = true }
hmac = { workspace = true }
p256 = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
