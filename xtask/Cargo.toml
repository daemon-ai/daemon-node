[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
anyhow = { workspace = true }
daemon-api = { workspace = true }
daemon-common = { workspace = true }
daemon-protocol = { workspace = true }
serde = { workspace = true }
# `tokenize-corpus` (M1): the pre-tokenized TinyStories shard writer (spec §8). xtask is dev tooling
# run by maintainers, not the shipped node, so its egress goes through `hf-hub` (revision-pinned; no
# raw `reqwest::Client` in xtask code — the clippy `disallowed_types` ban is respected) and the
# `tokenizers` crate does the BPE. Versions match the workspace lock (tokenizers 0.22, hf-hub 0.5).
## `tokenize-corpus` needs only the base session crate; `vhc-replay` (below) additionally needs the
## `harness` feature for the `SandboxedCoordinator` replay driver.
daemon-vhc-session = { workspace = true, features = ["harness"] }
# `author-ceremony-genesis`: the FROZEN ceremony genesis authoring library (never reimplemented —
# this xtask is a thin CLI around `daemon_vhc_testkit::ceremony::ceremony_genesis`).
daemon-vhc-testkit = { workspace = true }
# `vhc-replay`: the executable replay/archive verdict command runs BOTH oracle modes (input replay +
# sandboxed consensus re-derivation) over an on-disk archive. `daemon-vhc-observe` is the
# harness/oracle tooling seat (it decodes SDK round schemas — never linked by the production graph).
daemon-vhc-observe = { workspace = true }
# `vhc-replay` decodes the run's `AuthorityConfig` (to judge the archive's attested heads) and
# rebuilds `RecordSig`s. xtask is maintainer tooling (not a production host crate), so linking the
# schema/consensus SDK is outside the host→sdk dep-check prohibition.
daemon-vhc-sdk-consensus = { workspace = true }
# base64 for the ceremony seeder's `VHC_ENVELOPE_B64` artifact.
base64 = { workspace = true }
# `build-guests`: the shared guest-workspace builder (reproducibility remap env + cross-process
# build lock) — the same code path every wasm-backed test harness builds through, so the manifest
# this command pins and the bytes the suites rebuild can never diverge on build env.
daemon-vhc-guest-build = { workspace = true }
# The chunk-addressed corpus contract (`tokenize-corpus` / `publish-corpus`): the canonical-CBOR
# CorpusManifest + shard fold identities live in the proto contracts crate.
daemon-vhc-proto = { workspace = true }
# `publish-module` / `publish-corpus` (the fleet artifact-distribution path): upload artifacts to
# the payload store by content hash (presigned PUT direct-to-R2). Both are existing workspace deps
# already in the lock via daemon-vhc-net, so no new third-party crate / deny change.
daemon-vhc-net = { workspace = true }
daemon-egress = { workspace = true }
tokio = { workspace = true }
blake3 = { workspace = true }
serde_json = { workspace = true }
hf-hub = { workspace = true }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

[lints]
workspace = true
