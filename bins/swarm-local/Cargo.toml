[package]
name = "swarm-local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "swarm-local"
path = "src/main.rs"

[dependencies]
# The participant runtime + the local-coordinator shell + in-process peer harness (`harness`).
daemon-vhc-session = { workspace = true, features = ["harness"] }
# The frozen envelope schema + freeze/verify chain (§6.1).
daemon-vhc-proto = { workspace = true }
# The node-side worker supervisor for `--backend worker` (spawn/probe/assess/join over §10.2).
daemon-vhc-supervisor = { workspace = true }
# The tiny-llama preset config the demo envelope embeds when the authoring TOML leaves
# `[experiment.config]` empty (so `--backend worker` drives a real, non-trivial training round).
# The model/config presets come through the SDK-side sim layer (`daemon-vhc-sim`, which re-exports
# the reference CPU backend + presets natively) — swarm-local is a native harness over vhc-sim, per
# refactor §6/§11, closing the Phase-0 `swarm-local -> daemon-vhc-sdk(sim)` dependency-rule exception.
daemon-vhc-sim = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
# Parse the authoring TOML envelope (proto stays wasm32-clean + never parses TOML — §6.1).
toml = { workspace = true }
serde = { workspace = true }
# `[experiment.config]` is carried as an opaque CBOR value in the frozen envelope.
ciborium = { workspace = true }
anyhow = { workspace = true }
# `--emit-create-request` (A3, Merge-1 Decision 1): the registry CreateRunRequest JSON body with
# the declared RunConfig fields. Both already `[workspace.dependencies]` entries — no root change.
serde_json = { workspace = true }
base64 = { workspace = true }

[lints]
workspace = true
