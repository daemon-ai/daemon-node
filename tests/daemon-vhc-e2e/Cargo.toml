[package]
name = "daemon-vhc-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

# (Phase-E sunset cleanup) The `iroh` feature is GONE: it gated only the retired live-transport /
# staging suites (`live_transport.rs`, `staging_160m.rs`, `ws_live_workers.rs`, deleted with the v1
# driver), so post-sunset it enabled dependency features no remaining test consumed.

[dev-dependencies]
# The peer-side round engine + the local-coordinator harness + churn/failure drill machinery
# (feature-gated). Merge 2 swapped the scripted coordinator for the real `daemon-vhc-coordinator`
# tick loop; Wave 3 (R3) adds the drills over the same harness.
daemon-vhc-session = { workspace = true, features = ["harness"] }
daemon-vhc-proto = { workspace = true }
# The payload store + `PayloadStore` trait: the desync drill fetches checkpoint + payload bytes for
# the offline resync (checkpoint + record replay).
daemon-vhc-net = { workspace = true }
tokio = { workspace = true }
# (Phase-E sunset) the dev-deps whose consumer suites the sunset deleted are GONE:
# daemon-vhc-sdk went with the WasmBackend suites (wasm_profiles / typed_checkpoint_bridge) in the
# sunset commit itself; daemon-vhc-host, daemon-vhc-supervisor, daemon-vhc-node, daemon-api,
# daemon-egress, serde_json, base64 and ciborium (consumers: wasm_profiles / ws_live_workers /
# live_transport / staging_160m / checkpoint_resync) in the post-merge cleanup. The remaining
# oracles link sdk-rounds/sdk-v2/sdk-consensus only (tracked exceptions).
# The A2 choreography-move bridging oracle (tests/rounds_bridging_oracle.rs) compares the
# relocated round logic against the retained RoundEngine (the engine SURVIVED the sunset as the
# harness / cold-join substrate) — a tracked dependency-direction exception (registered in xtask
# vhc_dep_check), removed when the engine re-seats onto vhc-sim.
daemon-vhc-sdk-rounds = { workspace = true }
# The B2 corpus-windowing equivalence oracle (tests/corpus_windowing_oracle.rs): the SDK-side
# windowing policy (`daemon-vhc-sdk-v2::corpus`) must match the retained host pipeline
# (`daemon-vhc-session::data`) decision-for-decision. This leaf test crate is the one place both
# sides link legally (same rationale as the daemon-vhc-sdk-rounds entry above). Path dep
# (sdk-v2 is deliberately not in the frozen root [workspace.dependencies]).
daemon-vhc-sdk-v2 = { path = "../../crates/vhc/sdk/daemon-vhc-sdk-v2" }
# The pure coordinator `tick` loop (drills.rs) + observe replay oracle.
# Relocated at D2 from the dissolved daemon-vhc-coordinator into sdk/daemon-vhc-sdk-consensus's
# `coordinator` module; this leaf e2e crate links it directly (same both-sides-link rationale as
# the entries above). Tracked in xtask vhc_dep_check.
daemon-vhc-sdk-consensus = { workspace = true }
daemon-vhc-observe = { workspace = true }
blake3 = { workspace = true }

[lints]
workspace = true
