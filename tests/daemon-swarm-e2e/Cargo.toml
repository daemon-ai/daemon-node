[package]
name = "daemon-swarm-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[features]
# The live-transport exit gate (`tests/live_transport.rs`): the round engine over a REAL per-node
# `IrohGossip` mesh + a shared `FsPayloadStore` (B3). Off by default so the standard e2e gate stays
# fast + iroh-free; run with `cargo test -p daemon-swarm-e2e --features iroh`.
# P3 lane S additively pulls `daemon-vhc-net/ws` under the same live-gate feature: the 160M staging
# rehearsal (`tests/staging_160m.rs`) taps the run's WS control plane as a passive observer to write
# the `<run>.dsmlog` message-log capture. The default gate stays WS/TLS/iroh-free.
iroh = ["daemon-vhc-session/iroh", "daemon-vhc-net/ws"]

[dev-dependencies]
# The peer-side round engine + the local-coordinator harness + churn/failure drill machinery
# (feature-gated). Merge 2 swapped the scripted coordinator for the real `daemon-vhc-coordinator`
# tick loop; Wave 3 (R3) adds the drills over the same harness.
daemon-vhc-session = { workspace = true, features = ["harness"] }
daemon-vhc-proto = { workspace = true }
# The payload store + `PayloadStore` trait: the desync drill fetches checkpoint + payload bytes for
# the offline resync (checkpoint + record replay).
daemon-vhc-net = { workspace = true }
tokio = { workspace = true }
# The wasm-backed profile e2e (`tests/wasm_profiles.rs`): the real host training backend
# (`WasmBackend`), the pure coordinator `tick`, and the observe replay oracle (PROTO-20). All are
# already in the frozen root `[workspace.dependencies]`; no cycle (the e2e crate is a leaf).
daemon-vhc-host = { workspace = true }
daemon-vhc-sdk = { path = "../../crates/vhc/sdk/daemon-vhc-sdk", features = ["sim"] }
# The A2 choreography-move bridging oracle (tests/rounds_bridging_oracle.rs) compares the
# relocated round logic against the v1 engine — a tracked dependency-direction exception
# (registered in xtask vhc_dep_check), removed when the v1 engine dissolves at sunset.
daemon-vhc-sdk-rounds = { workspace = true }
# The B2 corpus-windowing equivalence oracle (tests/corpus_windowing_oracle.rs): the SDK-side
# windowing policy (`daemon-vhc-sdk-v2::corpus`) must match the v1 host pipeline
# (`daemon-vhc-session::data`) decision-for-decision. This leaf test crate is the one place both
# sides link legally (same rationale as the daemon-vhc-sdk entry above). Path dep like the sdk
# entry (sdk-v2 is deliberately not in the frozen root [workspace.dependencies]).
daemon-vhc-sdk-v2 = { path = "../../crates/vhc/sdk/daemon-vhc-sdk-v2" }
daemon-vhc-coordinator = { workspace = true }
daemon-vhc-observe = { workspace = true }
ciborium = { workspace = true }
blake3 = { workspace = true }
# The A3 live worker-subprocess e2e (`tests/ws_live_workers.rs`, env-gated on wrangler-dev): the
# node-side supervisor spawns REAL `daemon-vhc-worker` subprocesses, the SwarmService proves the
# event pump into swarm.db, EgressClient POSTs the create-run request + reads DO state, and
# serde_json/base64 author the request body. All existing `[workspace.dependencies]` entries — the
# e2e crate stays a leaf.
daemon-vhc-supervisor = { workspace = true }
daemon-vhc-node = { workspace = true }
daemon-api = { workspace = true }
daemon-egress = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }

[lints]
workspace = true
